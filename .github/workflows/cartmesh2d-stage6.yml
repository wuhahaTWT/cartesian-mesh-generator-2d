name: cartmesh2d-stage6

on:
  pull_request:
    paths:
      - 'cartmesh2d/**'
      - '.github/workflows/cartmesh2d-stage6.yml'
      - 'CMakeLists.txt'
  workflow_dispatch:

concurrency:
  group: cartmesh2d-stage6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-2d-stage6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Configure root project with native 2D enabled
        run: >-
          cmake -S . -B build_2d
          -DCMAKE_BUILD_TYPE=Release
          -DCARTMESH_BUILD_2D=ON
          -DCARTMESH_BUILD_TESTS=ON
          -DCARTMESH_BUILD_BENCHMARKS=OFF

      - name: Build native 2D targets
        run: >-
          cmake --build build_2d --target
          cartmesh2d_geometry_tests
          cartmesh2d_grid_tests
          cartmesh2d_quadtree_tests
          cartmesh2d_spatial_index_tests
          cartmesh2d_multiloop_tests
          cartmesh2d_solver_export_tests
          cartmesh2d_cutcell_tests
          cartmesh2d_cutcell_components_tests
          cartmesh2d_cutcell_quadtree_audit_tests
          cartmesh2d_topology_tests
          cartmesh2d_topology_quadtree_audit_tests
          cartmesh2d_small_cell_tests
          cartmesh2d_agglomeration_tests
          cartmesh2d_quality_tests
          cartmesh2d_io_tests
          cartmesh2d_dxf_tests
          cartmesh2d_boundary_layer_tests
          cartmesh2d_hybrid_mesh_tests
          cartmesh2d_h4_local_termination_tests
          cartmesh2d_cli
          cartmesh2d_dxf_cli
          cartmesh2d_boundary_layer_cli
          cartmesh2d_hybrid_cli
          -j2

      - name: Run native 2D stage tests
        run: ctest --test-dir build_2d -R '^cartmesh2d_stage' --output-on-failure

      - name: Verify H4 solver-ready OpenFOAM export
        shell: bash
        run: |
          set -euo pipefail
          out=build_2d/cartmesh2d/h4_solver_ready
          exe=build_2d/cartmesh2d/cartmesh2d_hybrid_cli
          mkdir -p "$out"

          "$exe" \
            cartmesh2d/examples/acceptance/circle.xy \
            "$out/circle" 6 3 6 4 0.02 1.2 1.0 \
            "$out/circle-case" 0.01
          python3 cartmesh2d/tools/verification/check_openfoam2d.py \
            "$out/circle-case" \
            --report "$out/circle-case/independent_check.json"

          "$exe" \
            cartmesh2d/examples/complex/superellipse_24.xy \
            "$out/superellipse" 6 3 6 3 0.015 1.15 1.0 \
            "$out/superellipse-case" 0.01
          python3 cartmesh2d/tools/verification/check_openfoam2d.py \
            "$out/superellipse-case" \
            --report "$out/superellipse-case/independent_check.json"

          "$exe" cartmesh2d/examples/h4_3/concave_l.xy \
            "$out/concave_l" 8 3 8 4 0.012 1.15 1.0 \
            "$out/concave_l-case" 0.01
          "$exe" cartmesh2d/examples/h4_3/sharp_trailing_edge.xy \
            "$out/sharp_trailing_edge" 8 3 8 4 0.012 1.15 1.0 \
            "$out/sharp_trailing_edge-case" 0.01
          "$exe" cartmesh2d/examples/h4_3/narrow_gap.xy \
            "$out/narrow_gap" 8 3 8 4 0.012 1.15 1.0 \
            "$out/narrow_gap-case" 0.01
          for case_name in concave_l sharp_trailing_edge narrow_gap; do
            python3 cartmesh2d/tools/verification/check_openfoam2d.py \
              "$out/${case_name}-case" \
              --report "$out/${case_name}-case/independent_check.json"
          done

          python3 - "$out/circle.hybrid.json" "$out/superellipse.hybrid.json" <<'PY'
          import json, sys
          for path in sys.argv[1:]:
              with open(path, encoding='utf-8') as f:
                  report = json.load(f)
              assert report['hybrid_status'] == 'success', path
              assert report['topology_valid'] is True, path
              assert report['mesh_quality_valid'] is True, path
              assert report['solver_quality_valid'] is True, path
              assert report['solver_quality_issue_count'] == 0, path
              assert report['balance_violations_after'] == 0, path
              assert report['single_owner_interface_edges'] == 0, path
              assert report['wrong_cell_pair_interface_edges'] == 0, path
              assert report['non_two_valent_interface_vertices'] == 0, path
          PY

          python3 - "$out/concave_l.hybrid.json" \
            "$out/sharp_trailing_edge.hybrid.json" \
            "$out/narrow_gap.hybrid.json" <<'PY'
          import json, sys
          for path in sys.argv[1:]:
              with open(path, encoding='utf-8') as f:
                  report = json.load(f)
              assert report['hybrid_status'] == 'success', path
              assert report['solver_quality_valid'] is True, path
              assert report['boundary_layer_cell_count'] > 0, path
              assert report['boundary_layer_cell_count'] < report['requested_boundary_layer_cell_count'], path
              assert report['termination_cell_count'] > 0, path
              assert report['termination_edge_count'] > 0, path
              assert abs(report['area_error']) < 1.0e-8, path
          PY

          image=opencfd/openfoam-run:2606
          container_root=/home/openfoam/workingDir
          docker pull "$image"
          for case_name in circle superellipse concave_l sharp_trailing_edge narrow_gap; do
            log="$out/${case_name}.checkMesh.log"
            docker run --rm \
              -v "$PWD:$container_root" \
              -w "$container_root" \
              "$image" \
              checkMesh -case "$container_root/$out/${case_name}-case" \
              2>&1 | tee "$log"
            if ! grep -q 'Mesh OK' "$log"; then
              echo "OpenFOAM v2606 checkMesh did not report Mesh OK for $case_name" >&2
              exit 1
            fi
          done
          printf 'checkMesh=PASS (OpenFOAM v2606)\n' | tee "$out/checkmesh_status.txt"

      - name: Verify exported acceptance artifacts and CFD fluid side
        shell: bash
        run: |
          set -euo pipefail
          out=build_2d/cartmesh2d/acceptance
          for case_name in rectangle circle concave airfoil_like; do
            test -s "$out/${case_name}.vtk"
            test -s "$out/${case_name}.cm2d"
            test -s "$out/${case_name}.quality.json"
            test -s "$out/${case_name}.viz.json"
            grep -q '^CM2D 1$' "$out/${case_name}.cm2d"
            python3 - "$out/${case_name}.quality.json" "$out/${case_name}.viz.json" "$out/${case_name}.cm2d" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              report = json.load(f)
          with open(sys.argv[2], encoding='utf-8') as f:
              viz = json.load(f)
          with open(sys.argv[3], encoding='utf-8') as f:
              cm2d = [line.strip() for line in f if line.strip()]

          assert report['valid'] is True
          assert all(value == 0 for value in report['topology_audit'].values())
          assert report['counts']['vertices'] > 0
          assert report['counts']['edges'] > 0
          assert report['counts']['cells'] > 0
          assert report['quality']['min_cell_area'] > 0.0
          assert report['quality']['min_edge_length'] > 0.0

          assert viz['format'] == 'cartmesh2d-viz-v1'
          assert viz['fluid_region'] == 'exterior'
          assert viz['boundary_role'] == 'solid_wall'
          assert isinstance(viz['source_cells'], list) and len(viz['source_cells']) > 0
          assert viz['source_small_cell_count'] == report['counts']['source_small_cells']
          for cell in viz['source_cells']:
              assert cell['kind'] in ('full', 'cut')
              assert cell['level'] >= 0
              assert len(cell['background_bounds']) == 4
              assert 0.0 < cell['area_fraction'] <= 1.0

          edge_header = next(i for i, line in enumerate(cm2d) if line.startswith('EDGES '))
          edge_count = int(cm2d[edge_header].split()[1])
          patches = [int(cm2d[edge_header + 1 + i].split()[5]) for i in range(edge_count)]
          assert patches.count(1) > 0, 'missing solid EmbeddedBoundary'
          assert patches.count(2) > 0, 'missing outer DomainBoundary'
          PY
          done

      - name: Run 2D-V renderer regression
        run: python3 cartmesh2d/tests/visualization_test.py

      - name: Render real acceptance meshes
        shell: bash
        run: |
          set -euo pipefail
          out=build_2d/cartmesh2d/acceptance
          for case_name in rectangle circle concave airfoil_like; do
            python3 cartmesh2d/tools/visualization/render_cm2d.py \
              "$out/${case_name}.cm2d" \
              "$out/${case_name}.svg" \
              --quality "$out/${case_name}.quality.json" \
              --viz "$out/${case_name}.viz.json" \
              --color-by level
            test -s "$out/${case_name}.svg"
            grep -q '<svg' "$out/${case_name}.svg"
            grep -q 'id="source-background"' "$out/${case_name}.svg"
            grep -q 'id="cells"' "$out/${case_name}.svg"
            grep -q 'id="edges"' "$out/${case_name}.svg"
            grep -q 'Quality summary' "$out/${case_name}.svg"
          done

      - name: Upload final 2D and H4 acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: cartmesh2d-final-validation
          path: |
            build_2d/cartmesh2d/acceptance/*.svg
            build_2d/cartmesh2d/acceptance/*.quality.json
            build_2d/cartmesh2d/acceptance/*.viz.json
            build_2d/cartmesh2d/acceptance/*.cm2d
            build_2d/cartmesh2d/h4_solver_ready/*.hybrid.*
            build_2d/cartmesh2d/h4_solver_ready/*-case/**
            build_2d/cartmesh2d/h4_solver_ready/*.checkMesh.log
            build_2d/cartmesh2d/h4_solver_ready/checkmesh_status.txt
          if-no-files-found: error

      - name: Configure root project with native 2D disabled
        run: >-
          cmake -S . -B build_2d_off
          -DCARTMESH_BUILD_2D=OFF
          -DCARTMESH_BUILD_BENCHMARKS=OFF
