name: cartmesh2d-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cartmesh2d-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-2d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCARTMESH2D_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j2

      - name: Run complete native 2D test suite
        run: ctest --test-dir build --output-on-failure
