name: cartmesh2d-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cartmesh2d-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-2d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify standalone repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d cartmesh2d
          test ! -d include/cartmesh
          if grep -R -n -E '#include[[:space:]]*[<"]cartmesh/' include src apps; then
            echo 'native 2D source must not depend on the 3D cartmesh library' >&2
            exit 1
          fi

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCARTMESH2D_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j2

      - name: Run complete native 2D test suite
        run: ctest --test-dir build --output-on-failure

      - name: Generate solver-ready H4 acceptance cases
        shell: bash
        run: |
          set -euo pipefail
          out=build/h4_solver_ready
          exe=build/cartmesh2d_hybrid_cli
          mkdir -p "$out"

          "$exe" examples/acceptance/circle.xy \
            "$out/circle" 6 3 6 4 0.02 1.2 1.0 \
            "$out/circle-case" 0.01
          "$exe" examples/complex/superellipse_24.xy \
            "$out/superellipse" 6 3 6 3 0.015 1.15 1.0 \
            "$out/superellipse-case" 0.01
          "$exe" examples/h4_3/concave_l.xy \
            "$out/concave_l" 8 3 8 4 0.012 1.15 1.0 \
            "$out/concave_l-case" 0.01
          "$exe" examples/h4_3/sharp_trailing_edge.xy \
            "$out/sharp_trailing_edge" 8 3 8 4 0.012 1.15 1.0 \
            "$out/sharp_trailing_edge-case" 0.01
          "$exe" examples/h4_3/narrow_gap.xy \
            "$out/narrow_gap" 8 3 8 4 0.012 1.15 1.0 \
            "$out/narrow_gap-case" 0.01
          "$exe" examples/h4_3/narrow_gap.xy \
            "$out/q3_narrow_gap" 8 3 8 4 0.012 1.15 1.0 \
            "$out/q3_narrow_gap-case" 0.01 --q3-termination-quality
          "$exe" examples/h4_3/narrow_gap.xy \
            "$out/q32_narrow_gap" 8 3 8 4 0.012 1.15 1.0 \
            "$out/q32_narrow_gap-case" 0.01 --q3-termination-repartition
          "$exe" examples/h4_3/narrow_gap.xy \
            "$out/q33_narrow_gap" 8 3 8 4 0.012 1.15 1.0 \
            "$out/q33_narrow_gap-case" 0.01 --q3-termination-grouped
          "$exe" examples/h4_3/narrow_gap.xy \
            "$out/q41_narrow_gap" 8 3 8 4 0.012 1.15 1.0 \
            "$out/q41_narrow_gap-case" 0.01 \
            --q4-termination-construction --q3-termination-grouped
          "$exe" examples/h4_3/sharp_trailing_edge.xy \
            "$out/q41_sharp_trailing_edge" 8 3 8 4 0.012 1.15 1.0 \
            "$out/q41_sharp_trailing_edge-case" 0.01 \
            --q4-termination-construction --q3-termination-grouped
          "$exe" examples/acceptance/circle.xy \
            "$out/q51_circle" 6 3 6 4 0.02 1.2 1.0 \
            "$out/q51_circle-case" 0.01 --q5-outer-transition-radial
          "$exe" examples/complex/superellipse_24.xy \
            "$out/q51_superellipse" 6 3 6 3 0.015 1.15 1.0 \
            "$out/q51_superellipse-case" 0.01 --q5-outer-transition-radial
          for case_name in concave_l sharp_trailing_edge narrow_gap; do
            "$exe" "examples/h4_3/${case_name}.xy" \
              "$out/q52_${case_name}" 8 3 8 4 0.012 1.15 1.0 \
              "$out/q52_${case_name}-case" 0.01 --q5-termination-buffer-radial
          done

          for case_name in circle superellipse concave_l sharp_trailing_edge narrow_gap; do
            python3 tools/verification/check_openfoam2d.py \
              "$out/${case_name}-case" \
              --report "$out/${case_name}-case/independent_check.json"
          done
          python3 tools/verification/check_openfoam2d.py \
            "$out/q3_narrow_gap-case" \
            --report "$out/q3_narrow_gap-case/independent_check.json"
          python3 tools/verification/check_openfoam2d.py \
            "$out/q32_narrow_gap-case" \
            --report "$out/q32_narrow_gap-case/independent_check.json"
          python3 tools/verification/check_openfoam2d.py \
            "$out/q33_narrow_gap-case" \
            --report "$out/q33_narrow_gap-case/independent_check.json"
          python3 tools/verification/check_openfoam2d.py \
            "$out/q41_narrow_gap-case" \
            --report "$out/q41_narrow_gap-case/independent_check.json"
          python3 tools/verification/check_openfoam2d.py \
            "$out/q41_sharp_trailing_edge-case" \
            --report "$out/q41_sharp_trailing_edge-case/independent_check.json"
          python3 tools/verification/check_openfoam2d.py \
            "$out/q51_circle-case" \
            --report "$out/q51_circle-case/independent_check.json"
          for case_name in concave_l sharp_trailing_edge narrow_gap; do
            python3 tools/verification/check_openfoam2d.py \
              "$out/q52_${case_name}-case" \
              --report "$out/q52_${case_name}-case/independent_check.json"
          done
          python3 tools/verification/check_openfoam2d.py \
            "$out/q51_superellipse-case" \
            --report "$out/q51_superellipse-case/independent_check.json"

          python3 - "$out" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          for name in ('circle', 'superellipse', 'concave_l',
                       'sharp_trailing_edge', 'narrow_gap'):
              path = root / f'{name}.hybrid.json'
              with path.open(encoding='utf-8') as stream:
                  report = json.load(stream)
              assert report['hybrid_status'] == 'success', path
              assert report['topology_valid'] is True, path
              assert report['mesh_quality_valid'] is True, path
              assert report['solver_quality_valid'] is True, path
              assert report['solver_quality_issue_count'] == 0, path
              assert report['balance_violations_after'] == 0, path
              assert report['single_owner_interface_edges'] == 0, path
              assert report['wrong_cell_pair_interface_edges'] == 0, path
              assert report['non_two_valent_interface_vertices'] == 0, path
              assert abs(report['area_error']) < 1.0e-8, path

          for name in ('concave_l', 'sharp_trailing_edge', 'narrow_gap'):
              path = root / f'{name}.hybrid.json'
              with path.open(encoding='utf-8') as stream:
                  report = json.load(stream)
              assert report['boundary_layer_cell_count'] > 0, path
              assert (report['boundary_layer_cell_count'] <
                      report['requested_boundary_layer_cell_count']), path
              assert report['termination_cell_count'] > 0, path
              assert report['termination_edge_count'] > 0, path

          q3_path = root / 'q3_narrow_gap.hybrid.json'
          q3 = json.loads(q3_path.read_text(encoding='utf-8'))
          assert q3['hybrid_status'] == 'success', q3_path
          assert q3['solver_quality_valid'] is True, q3_path
          assert q3['solver_quality_issue_count'] == 0, q3_path
          assert q3['q3_hard_volume_ratio_count_after'] < q3['q3_hard_volume_ratio_count_before'], q3_path
          assert q3['q3_hard_face_weight_count_after'] < q3['q3_hard_face_weight_count_before'], q3_path
          assert q3['q3_hard_short_face_count_before'] == 0, q3_path
          assert q3['q3_hard_short_face_count_after'] == 0, q3_path
          assert q3['q3_candidate_global_topology_build_count'] == 0, q3_path
          assert q3['q3_candidate_full_global_quality_evaluation_count'] == 0, q3_path
          assert q3['q3_maximum_winner_global_oracle_builds_per_transaction'] <= 1, q3_path
          assert q3['q3_patch_outside_stable_ids_unchanged'] is True, q3_path
          assert q3['q3_local_delta_matches_global_oracle'] is True, q3_path
          assert q3['q3_local_winner_matches_global_authority'] is True, q3_path

          q32_path = root / 'q32_narrow_gap.hybrid.json'
          q32 = json.loads(q32_path.read_text(encoding='utf-8'))
          assert q32['hybrid_status'] == 'success', q32_path
          assert q32['solver_quality_valid'] is True, q32_path
          assert q32['solver_quality_issue_count'] == 0, q32_path
          assert q32['q32_hard_volume_ratio_count_after'] < q32['q32_hard_volume_ratio_count_before'], q32_path
          assert q32['q32_hard_face_weight_count_after'] < q32['q32_hard_face_weight_count_before'], q32_path
          assert q32['q32_hard_short_face_count_before'] == 0, q32_path
          assert q32['q32_hard_short_face_count_after'] == 0, q32_path
          assert q32['q32_candidate_global_topology_build_count'] == 0, q32_path
          assert q32['q32_candidate_full_global_quality_evaluation_count'] == 0, q32_path
          assert q32['q32_maximum_winner_global_oracle_builds_per_transaction'] <= 1, q32_path
          assert q32['q32_patch_outside_stable_ids_unchanged'] is True, q32_path
          assert q32['q32_local_delta_matches_global_oracle'] is True, q32_path
          assert q32['q32_local_winner_matches_global_authority'] is True, q32_path
          assert q32['solver_cell_count'] == q3['solver_cell_count'], q32_path

          q33_path = root / 'q33_narrow_gap.hybrid.json'
          q33 = json.loads(q33_path.read_text(encoding='utf-8'))
          assert q33['hybrid_status'] == 'success', q33_path
          assert q33['solver_quality_valid'] is True, q33_path
          assert q33['solver_quality_issue_count'] == 0, q33_path
          assert q33['q33_hard_volume_ratio_count_after'] < q33['q33_hard_volume_ratio_count_before'], q33_path
          assert q33['q33_hard_face_weight_count_after'] <= q33['q33_hard_face_weight_count_before'], q33_path
          assert q33['q33_hard_short_face_count_before'] == 0, q33_path
          assert q33['q33_hard_short_face_count_after'] == 0, q33_path
          assert q33['q33_candidate_global_topology_build_count'] == 0, q33_path
          assert q33['q33_candidate_full_global_quality_evaluation_count'] == 0, q33_path
          assert q33['q33_maximum_winner_global_oracle_builds_per_transaction'] <= 1, q33_path
          assert q33['q33_patch_outside_stable_ids_unchanged'] is True, q33_path
          assert q33['q33_local_delta_matches_global_oracle'] is True, q33_path
          assert q33['q33_local_winner_matches_global_authority'] is True, q33_path
          assert q33['solver_cell_count'] == q32['solver_cell_count'], q33_path

          q41_path = root / 'q41_narrow_gap.hybrid.json'
          q41 = json.loads(q41_path.read_text(encoding='utf-8'))
          assert q41['hybrid_status'] == 'success', q41_path
          assert q41['solver_quality_valid'] is True, q41_path
          assert q41['solver_quality_issue_count'] == 0, q41_path
          assert q41['q41_accepted_construction_count'] > 0, q41_path
          assert q41['q41_hard_volume_ratio_count_after'] < q41['q41_hard_volume_ratio_count_before'], q41_path
          assert q41['q41_hard_face_weight_count_after'] < q41['q41_hard_face_weight_count_before'], q41_path
          assert q41['q41_hard_short_face_count_after'] <= q41['q41_hard_short_face_count_before'], q41_path
          assert q41['q41_candidate_global_topology_build_count'] == 0, q41_path
          assert q41['q41_candidate_full_global_quality_evaluation_count'] == 0, q41_path
          assert q41['q41_maximum_winner_global_oracle_builds_per_construction'] <= 1, q41_path
          assert q41['q41_patch_outside_stable_ids_unchanged'] is True, q41_path
          assert q41['q41_local_delta_matches_global_oracle'] is True, q41_path
          assert q41['q41_local_winner_matches_global_authority'] is True, q41_path
          assert q41['q33_hard_volume_ratio_count_after'] < q33['q33_hard_volume_ratio_count_after'], q41_path
          assert q41['q33_hard_face_weight_count_after'] < q33['q33_hard_face_weight_count_after'], q41_path
          assert q41['q33_hard_short_face_count_after'] == 0, q41_path
          assert q41['q41_construction_selection_declined'] is False, q41_path

          # Q4-1 must never cost a boundary layer. On the sharp taper its
          # candidate fails a final gate, so the committed mesh has to stay the
          # solver-safe hybrid with explicit selection outcome and retained layers.
          q41_sharp_path = root / 'q41_sharp_trailing_edge.hybrid.json'
          q41_sharp = json.loads(q41_sharp_path.read_text(encoding='utf-8'))
          sharp = json.loads(
              (root / 'sharp_trailing_edge.hybrid.json').read_text(encoding='utf-8'))
          assert q41_sharp['hybrid_status'] == 'success', q41_sharp_path
          assert q41_sharp['solver_quality_valid'] is True, q41_sharp_path
          assert q41_sharp['solver_quality_issue_count'] == 0, q41_sharp_path
          if q41_sharp['q41_construction_selection_declined']:
              assert q41_sharp['q41_accepted_construction_count'] == 0, q41_sharp_path
          else:
              assert q41_sharp['q41_accepted_construction_count'] > 0, q41_sharp_path
          assert (q41_sharp['boundary_layer_cell_count'] ==
                  sharp['boundary_layer_cell_count']), q41_sharp_path
          assert abs(q41_sharp['area_error']) < 1.0e-8, q41_sharp_path

          # Q5-1 cuts the outermost transition row radially. The last row's
          # offset is arithmetically the single-row offset, so the remainder
          # quadtree must be untouched: identical Cut/Cartesian/layer counts
          # and strictly more transition rows.
          for name in ('circle', 'superellipse'):
              base = json.loads(
                  (root / f'{name}.hybrid.json').read_text(encoding='utf-8'))
              radial_path = root / f'q51_{name}.hybrid.json'
              radial = json.loads(radial_path.read_text(encoding='utf-8'))
              assert radial['hybrid_status'] == 'success', radial_path
              assert radial['solver_quality_valid'] is True, radial_path
              assert radial['solver_quality_issue_count'] == 0, radial_path
              assert radial['q51_outer_transition_radial_subdivision'] > 1, radial_path
              assert radial['q51_outer_transition_radial_declined'] is False, radial_path
              assert (radial['remainder_cut_cell_count'] ==
                      base['remainder_cut_cell_count']), radial_path
              assert (radial['remainder_cartesian_cell_count'] ==
                      base['remainder_cartesian_cell_count']), radial_path
              assert (radial['boundary_layer_cell_count'] ==
                      base['boundary_layer_cell_count']), radial_path
              assert (radial['transition_polygon_count'] >
                      base['transition_polygon_count']), radial_path
              assert radial['single_owner_interface_edges'] == 0, radial_path
              assert radial['wrong_cell_pair_interface_edges'] == 0, radial_path
              assert radial['non_two_valent_interface_vertices'] == 0, radial_path
              assert abs(radial['area_error']) < 1.0e-8, radial_path
              if radial['q51_outer_transition_radial_subdivision'] > 1:
                  assert radial['q51_outer_transition_radial_target_reachable'] is True, radial_path

          # Keep construction reachability, Solver and deterministic-decline
          # guards after removing the unrelated Q1 contract measurements.
          for name in ('concave_l', 'sharp_trailing_edge', 'narrow_gap'):
              report = json.loads((root / f'q52_{name}.hybrid.json').read_text())
              committed = report['q52_termination_buffer_radial_committed']
              matched = report['q52_termination_buffer_target_issues_with_matching']
              historical = report['q52_termination_buffer_target_issues_with_historical_march']
              assert committed == (matched < historical), (name, matched, historical)
              if committed:
                  assert report['q52_termination_buffer_row_cap_reachable'] is True, name
                  assert report['q52_termination_buffer_outer_row_thickness'] <= (
                      report['q52_termination_buffer_row_cap'] * (1.0 + 1.0e-12)), name
              assert report['solver_quality_valid'] is True, name
              assert report['solver_quality_issue_count'] == 0, name
              assert abs(report['area_error']) < 1.0e-8, name
              if not committed:
                  for suffix in ('hybrid.cm2d', 'hybrid.solver.cm2d'):
                      assert ((root / f'q52_{name}.{suffix}').read_bytes() ==
                              (root / f'{name}.{suffix}').read_bytes()), (name, suffix)
          PY

      - name: Run OpenFOAM v2606 checkMesh
        shell: bash
        run: |
          set -euo pipefail
          out=build/h4_solver_ready
          image=opencfd/openfoam-run:2606
          container_root=/home/openfoam/workingDir
          docker pull "$image"
          for case_name in circle superellipse concave_l sharp_trailing_edge narrow_gap q3_narrow_gap q32_narrow_gap q33_narrow_gap q41_narrow_gap q41_sharp_trailing_edge q51_circle q51_superellipse q52_concave_l q52_sharp_trailing_edge q52_narrow_gap; do
            log="$out/${case_name}.checkMesh.log"
            docker run --rm \
              -v "$PWD:$container_root" \
              -w "$container_root" \
              "$image" \
              checkMesh -case "$container_root/$out/${case_name}-case" \
              -writeAllFields \
              2>&1 | tee "$log"
            grep -q 'Mesh OK' "$log"
          done
          printf 'checkMesh=PASS (OpenFOAM v2606)\n' \
            | tee "$out/checkmesh_status.txt"

      - name: Build and deterministically replay Q0 quality baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verification/generate_q0_baselines.py \
            --repo . --build-dir build \
            --evidence-dir build/h4_solver_ready \
            --output-dir build/q0_baselines \
            --source-commit "$GITHUB_SHA" --collect-only
          python3 tools/verification/generate_q0_baselines.py \
            --repo . --build-dir build \
            --evidence-dir build/h4_solver_ready \
            --output-dir build/q0_baselines_repeat \
            --source-commit "$GITHUB_SHA" --collect-only
          diff -ru build/q0_baselines build/q0_baselines_repeat

      - name: Gate the pure Cut-cell refinement ladder
        shell: bash
        run: |
          set -euo pipefail
          # This ladder already holds every SolverQualityPolicy2D hard limit up to
          # level 9 (about 20k leaves in under a second), so it is gated: it is a
          # real regression guard on refinement behaviour that works today.
          python3 tools/verification/refinement_ladder.py \
            --repo . --build-dir build --evidence-dir build/r2_ladder \
            --output-dir build/r2_ladder --manifest-name cutcell-ladder-manifest.json \
            --gate \
            --ladder circle:cutcell:6,7,8,9

      - name: Record the hybrid refinement ladder
        shell: bash
        run: |
          set -euo pipefail
          # Level 9 remains in the local long ladder because it costs about 150 s.
          # Level 9 is left to the local long ladder because it costs ~150 s.
          python3 tools/verification/refinement_ladder.py \
            --repo . --build-dir build --evidence-dir build/r2_ladder \
            --output-dir build/r2_ladder --manifest-name hybrid-ladder-manifest.json \
            --ladder circle:hybrid:6,7,8

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v6
        with:
          name: cartmesh2d-h4-validation
          path: |
            build/h4_solver_ready/*.hybrid.*
            build/h4_solver_ready/*-case/**
            build/h4_solver_ready/*.checkMesh.log
            build/h4_solver_ready/checkmesh_status.txt
            build/q0_baselines/*.json
            build/r2_ladder/*-ladder-manifest.json
          if-no-files-found: error
