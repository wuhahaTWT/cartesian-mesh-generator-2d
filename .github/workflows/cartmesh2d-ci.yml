name: cartmesh2d-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cartmesh2d-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-2d:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify standalone repository boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d cartmesh2d
          test ! -d include/cartmesh
          if grep -R -n -E '#include[[:space:]]*[<"]cartmesh/' include src apps; then
            echo 'native 2D source must not depend on the 3D cartmesh library' >&2
            exit 1
          fi

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCARTMESH2D_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j2

      - name: Run complete native 2D test suite
        run: ctest --test-dir build --output-on-failure

      - name: Generate solver-ready H4 acceptance cases
        shell: bash
        run: |
          set -euo pipefail
          out=build/h4_solver_ready
          exe=build/cartmesh2d_hybrid_cli
          mkdir -p "$out"

          "$exe" examples/acceptance/circle.xy \
            "$out/circle" 6 3 6 4 0.02 1.2 1.0 \
            "$out/circle-case" 0.01
          "$exe" examples/complex/superellipse_24.xy \
            "$out/superellipse" 6 3 6 3 0.015 1.15 1.0 \
            "$out/superellipse-case" 0.01
          "$exe" examples/h4_3/concave_l.xy \
            "$out/concave_l" 8 3 8 4 0.012 1.15 1.0 \
            "$out/concave_l-case" 0.01
          "$exe" examples/h4_3/sharp_trailing_edge.xy \
            "$out/sharp_trailing_edge" 8 3 8 4 0.012 1.15 1.0 \
            "$out/sharp_trailing_edge-case" 0.01
          "$exe" examples/h4_3/narrow_gap.xy \
            "$out/narrow_gap" 8 3 8 4 0.012 1.15 1.0 \
            "$out/narrow_gap-case" 0.01
          "$exe" examples/h4_3/narrow_gap.xy \
            "$out/q3_narrow_gap" 8 3 8 4 0.012 1.15 1.0 \
            "$out/q3_narrow_gap-case" 0.01 --q3-termination-quality
          "$exe" examples/h4_3/narrow_gap.xy \
            "$out/q32_narrow_gap" 8 3 8 4 0.012 1.15 1.0 \
            "$out/q32_narrow_gap-case" 0.01 --q3-termination-repartition
          "$exe" examples/h4_3/narrow_gap.xy \
            "$out/q33_narrow_gap" 8 3 8 4 0.012 1.15 1.0 \
            "$out/q33_narrow_gap-case" 0.01 --q3-termination-grouped

          for case_name in circle superellipse concave_l sharp_trailing_edge narrow_gap; do
            python3 tools/verification/check_openfoam2d.py \
              "$out/${case_name}-case" \
              --report "$out/${case_name}-case/independent_check.json"
          done
          python3 tools/verification/check_openfoam2d.py \
            "$out/q3_narrow_gap-case" \
            --report "$out/q3_narrow_gap-case/independent_check.json"
          python3 tools/verification/check_openfoam2d.py \
            "$out/q32_narrow_gap-case" \
            --report "$out/q32_narrow_gap-case/independent_check.json"
          python3 tools/verification/check_openfoam2d.py \
            "$out/q33_narrow_gap-case" \
            --report "$out/q33_narrow_gap-case/independent_check.json"

          python3 - "$out" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          for name in ('circle', 'superellipse', 'concave_l',
                       'sharp_trailing_edge', 'narrow_gap'):
              path = root / f'{name}.hybrid.json'
              with path.open(encoding='utf-8') as stream:
                  report = json.load(stream)
              assert report['hybrid_status'] == 'success', path
              assert report['topology_valid'] is True, path
              assert report['mesh_quality_valid'] is True, path
              assert report['solver_quality_valid'] is True, path
              assert report['solver_quality_issue_count'] == 0, path
              assert report['quality_contract_status'] in ('PASS', 'WARN', 'FAIL'), path
              assert report['balance_violations_after'] == 0, path
              assert report['single_owner_interface_edges'] == 0, path
              assert report['wrong_cell_pair_interface_edges'] == 0, path
              assert report['non_two_valent_interface_vertices'] == 0, path
              assert abs(report['area_error']) < 1.0e-8, path

          for name in ('concave_l', 'sharp_trailing_edge', 'narrow_gap'):
              path = root / f'{name}.hybrid.json'
              with path.open(encoding='utf-8') as stream:
                  report = json.load(stream)
              assert report['boundary_layer_cell_count'] > 0, path
              assert (report['boundary_layer_cell_count'] <
                      report['requested_boundary_layer_cell_count']), path
              assert report['termination_cell_count'] > 0, path
              assert report['termination_edge_count'] > 0, path

          q3_path = root / 'q3_narrow_gap.hybrid.json'
          q3 = json.loads(q3_path.read_text(encoding='utf-8'))
          assert q3['hybrid_status'] == 'success', q3_path
          assert q3['solver_quality_valid'] is True, q3_path
          assert q3['solver_quality_issue_count'] == 0, q3_path
          assert q3['q3_hard_volume_ratio_count_after'] < q3['q3_hard_volume_ratio_count_before'], q3_path
          assert q3['q3_hard_face_weight_count_after'] < q3['q3_hard_face_weight_count_before'], q3_path
          assert q3['q3_hard_short_face_count_before'] == 0, q3_path
          assert q3['q3_hard_short_face_count_after'] == 0, q3_path
          assert q3['q3_candidate_global_topology_build_count'] == 0, q3_path
          assert q3['q3_candidate_full_global_quality_evaluation_count'] == 0, q3_path
          assert q3['q3_maximum_winner_global_oracle_builds_per_transaction'] <= 1, q3_path
          assert q3['q3_patch_outside_stable_ids_unchanged'] is True, q3_path
          assert q3['q3_local_delta_matches_global_oracle'] is True, q3_path
          assert q3['q3_local_winner_matches_global_authority'] is True, q3_path

          q32_path = root / 'q32_narrow_gap.hybrid.json'
          q32 = json.loads(q32_path.read_text(encoding='utf-8'))
          assert q32['hybrid_status'] == 'success', q32_path
          assert q32['solver_quality_valid'] is True, q32_path
          assert q32['solver_quality_issue_count'] == 0, q32_path
          assert q32['q32_hard_volume_ratio_count_after'] < q32['q32_hard_volume_ratio_count_before'], q32_path
          assert q32['q32_hard_face_weight_count_after'] < q32['q32_hard_face_weight_count_before'], q32_path
          assert q32['q32_hard_short_face_count_before'] == 0, q32_path
          assert q32['q32_hard_short_face_count_after'] == 0, q32_path
          assert q32['q32_candidate_global_topology_build_count'] == 0, q32_path
          assert q32['q32_candidate_full_global_quality_evaluation_count'] == 0, q32_path
          assert q32['q32_maximum_winner_global_oracle_builds_per_transaction'] <= 1, q32_path
          assert q32['q32_patch_outside_stable_ids_unchanged'] is True, q32_path
          assert q32['q32_local_delta_matches_global_oracle'] is True, q32_path
          assert q32['q32_local_winner_matches_global_authority'] is True, q32_path
          assert q32['solver_cell_count'] == q3['solver_cell_count'], q32_path

          q33_path = root / 'q33_narrow_gap.hybrid.json'
          q33 = json.loads(q33_path.read_text(encoding='utf-8'))
          assert q33['hybrid_status'] == 'success', q33_path
          assert q33['solver_quality_valid'] is True, q33_path
          assert q33['solver_quality_issue_count'] == 0, q33_path
          assert q33['q33_hard_volume_ratio_count_after'] < q33['q33_hard_volume_ratio_count_before'], q33_path
          assert q33['q33_hard_face_weight_count_after'] <= q33['q33_hard_face_weight_count_before'], q33_path
          assert q33['q33_hard_short_face_count_before'] == 0, q33_path
          assert q33['q33_hard_short_face_count_after'] == 0, q33_path
          assert q33['q33_candidate_global_topology_build_count'] == 0, q33_path
          assert q33['q33_candidate_full_global_quality_evaluation_count'] == 0, q33_path
          assert q33['q33_maximum_winner_global_oracle_builds_per_transaction'] <= 1, q33_path
          assert q33['q33_patch_outside_stable_ids_unchanged'] is True, q33_path
          assert q33['q33_local_delta_matches_global_oracle'] is True, q33_path
          assert q33['q33_local_winner_matches_global_authority'] is True, q33_path
          assert q33['solver_cell_count'] == q32['solver_cell_count'], q33_path
          PY

      - name: Verify Q1 typed dimensionless quality contract
        shell: bash
        run: |
          set -euo pipefail
          out=build/h4_solver_ready
          python3 - "$out" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          names = ('circle', 'superellipse', 'concave_l',
                   'sharp_trailing_edge', 'narrow_gap')
          for name in names:
              path = root / f'{name}.hybrid.quality-contract.json'
              report = json.loads(path.read_text(encoding='utf-8'))
              assert report['quality_class'] == 'solver_quality_contract', path
              assert report['dimensionless'] is True, path
              assert report['status'] in ('PASS', 'WARN', 'FAIL'), path
              assert report['input_issues'] == [], path
              assert report['legacy_hard_safety']['valid'] is True, path
              for metric in ('face_length_over_local_background_h',
                             'face_length_over_sqrt_owner_area',
                             'face_length_over_sqrt_neighbour_area'):
                  assert metric in report['ordinary_metrics'], (path, metric)
              assert 'boundary_layer' in report['by_cell_type'], path
              for metric in ('wall_normal_orthogonality_error_deg', 'growth_ratio',
                             'tangential_normal_spacing_ratio',
                             'adjacent_column_thickness_variation',
                             'scaled_jacobian', 'first_layer_continuity'):
                  assert metric in report['boundary_layer_metrics'], (path, metric)

          # Q2 removed the historical superellipse micro-face hard failure.
          # Keep this assertion aligned with generate_q1_baselines.py below:
          # absolute face length is not the contract; dimensionless face/local-h is.
          superellipse = json.loads((root /
              'superellipse.hybrid.quality-contract.json').read_text(encoding='utf-8'))
          micro = superellipse['ordinary_metrics']['face_length_over_local_background_h']
          hard_short = [issue for issue in superellipse['issues']
                        if issue['level'] == 'hard' and
                        issue['metric'].startswith('face_length_over_')]
          assert micro['worst'] >= 0.01
          assert hard_short == []
          PY

          python3 tools/verification/verify_q1_scale_invariance.py \
            --repo . --build-dir build --reference-dir "$out" \
            --output-dir build/q1_scale --scale 1000

      - name: Run OpenFOAM v2606 checkMesh
        shell: bash
        run: |
          set -euo pipefail
          out=build/h4_solver_ready
          image=opencfd/openfoam-run:2606
          container_root=/home/openfoam/workingDir
          docker pull "$image"
          for case_name in circle superellipse concave_l sharp_trailing_edge narrow_gap q3_narrow_gap q32_narrow_gap q33_narrow_gap; do
            log="$out/${case_name}.checkMesh.log"
            docker run --rm \
              -v "$PWD:$container_root" \
              -w "$container_root" \
              "$image" \
              checkMesh -case "$container_root/$out/${case_name}-case" \
              -writeAllFields \
              2>&1 | tee "$log"
            grep -q 'Mesh OK' "$log"
          done
          printf 'checkMesh=PASS (OpenFOAM v2606)\n' \
            | tee "$out/checkmesh_status.txt"

      - name: Build and deterministically replay Q0 quality baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verification/generate_q0_baselines.py \
            --repo . --build-dir build \
            --evidence-dir build/h4_solver_ready \
            --output-dir build/q0_baselines \
            --source-commit "$GITHUB_SHA" --collect-only
          python3 tools/verification/generate_q0_baselines.py \
            --repo . --build-dir build \
            --evidence-dir build/h4_solver_ready \
            --output-dir build/q0_baselines_repeat \
            --source-commit "$GITHUB_SHA" --collect-only
          diff -ru build/q0_baselines build/q0_baselines_repeat

      - name: Deterministically collect Q1 compact baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verification/generate_q1_baselines.py \
            --repo . --build-dir build --evidence-dir build/h4_solver_ready \
            --output-dir build/q1_baselines --source-commit "$GITHUB_SHA" \
            --expect-superellipse-short-faces absent \
            --collect-only
          python3 tools/verification/generate_q1_baselines.py \
            --repo . --build-dir build --evidence-dir build/h4_solver_ready \
            --output-dir build/q1_baselines_repeat --source-commit "$GITHUB_SHA" \
            --expect-superellipse-short-faces absent \
            --collect-only
          diff -ru build/q1_baselines build/q1_baselines_repeat

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: cartmesh2d-h4-validation
          path: |
            build/h4_solver_ready/*.hybrid.*
            build/h4_solver_ready/*-case/**
            build/h4_solver_ready/*.checkMesh.log
            build/h4_solver_ready/checkmesh_status.txt
            build/q0_baselines/*.json
            build/q1_baselines/*.json
            build/q1_scale/**
          if-no-files-found: error
