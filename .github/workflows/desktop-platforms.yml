name: desktop-platforms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', 'src/**', 'include/**', 'apps/**', 'tests/**', 'tools/flow/**', 'CMakeLists.txt', '.github/workflows/desktop-platforms.yml']
  pull_request:
    paths: ['desktop/**', 'src/**', 'include/**', 'apps/**', 'tests/**', 'tools/flow/**', 'CMakeLists.txt', '.github/workflows/desktop-platforms.yml']

permissions:
  contents: read
concurrency:
  group: desktop-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: win
            arch: x64
          - os: macos-14
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libasound2 libgbm1
      - name: Install locked desktop dependencies
        run: npm ci --prefix desktop
      - name: Build host native tools and stage runtime
        run: npm --prefix desktop run build:native
      - name: Build all native tests
        run: cmake --build build --config Release --parallel 2
      - name: Desktop tests
        run: npm --prefix desktop test
      - name: Package host desktop
        run: npm --prefix desktop run pack:${{ matrix.platform }}
      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evidence-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 14
          path: |
            build/Testing/Temporary/LastTest.log
            desktop/runtime/manifest.json
          if-no-files-found: warn
      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: CartMesh2D-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 7
          path: |
            desktop/dist/*.zip
            desktop/dist/*.tar.gz
          if-no-files-found: error
